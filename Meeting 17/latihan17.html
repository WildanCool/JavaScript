<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p style="color: red">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Labore, hic!
    </p>
    <ul class="list">
      <li id="1">Item 1</li>
      <li id="2">Item 2</li>
      <li id="3">Item 3</li>
    </ul>
  </body>
  <script>
    const p = document.querySelector("p");
    p.setAttribute("style", "color: blue;");

    const item2 = document.getElementById("2");

    const item4 = document.createElement("li");
    const list = document.getElementsByClassName("list");
    item4.innerText = "Item 4";
    list[0].appendChild(item4);

    list[0].insertBefore(item4, item2);
  </script>
</html>
