<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 20</title>
    <style>
      .contents {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid black;
        padding: 15px;
      }

      .form-element {
        margin: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <!-- coba 3 popular event -->
    <div
      id="myDiv"
      style="height: 100px; width: 170px; background-color: red; margin: auto"
    >
      KOTAKK KUUUU
    </div>
    <input type="text" id="myInput" />
    <p id="theText">Mbappe telah bergabung pada tahun 2024 kemarin (COPY BROO!)</p>

    <!-- Coba Prevent Default -->
    <a href="https://www.google.com" id="myLink">Kunjungi Google.com</a>
    <div class="message" id="message"></div>

    <!-- Membuat Form -->
    <div class="contents">
      <h2 align="center">Isi data diri</h2>

      <div class="formContent">
        <form id="formDataDiri">
          <div class="form-element">
            <label for="inputNama">Nama:</label><br />
            <input
              type="text"
              id="inputNama"
              name="nama"
              placeholder="Nama Anda"
              required
            /><br />
          </div>

          <div class="form-element">
            <label for="inputDomisili">Domisili:</label><br />
            <input
              type="text"
              id="inputDomisili"
              name="domisili"
              placeholder="Domisili Anda"
              required
            /><br />
          </div>

          <div class="form-element">
            <input type="submit" value="Submit Data" />
          </div>
        </form>
      </div>

      <h3 id="messageAfterSubmit"></h3>
    </div>
  </body>

  <script>
    // Coba 3 popular event
    document.getElementById("myDiv").addEventListener("mouseover", function () {
      this.style.backgroundColor = "green";
    });

    document.getElementById("myInput").addEventListener("keydown", function () {
      this.style.backgroundColor = "orange";
      console.log("Anda megetik : " + this.value);
    });

    const theText = document.getElementById("theText");
    theText.addEventListener("copy", function () {
      alert("Copy-an anda telah tersimpan di Clipboard");
    });

    // Coba Prevent Default
    const myLink = document.getElementById("myLink");
    const message = document.getElementById("message");

    myLink.addEventListener("click", function (event) {
      event.preventDefault();

      message.textContent =
        "Anda mengklik link, tetapi tidak diarahkan ke situs Google.com";
    });

    // Membuat Form
    const submitAction = document.getElementById("formDataDiri");

    submitAction.addEventListener("submit", function (event) {
      const inputNama = document.getElementById("inputNama").value;
      const inputDomisili = document.getElementById("inputDomisili").value;
      const hiddenMessage = `Halo, ${inputNama}. Bagaimana cuacanya di ${inputDomisili}?`;

      document.getElementById("messageAfterSubmit").innerText = hiddenMessage;
      event.preventDefault();
    });
  </script>
</html>
