<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal Gambar Meeting 20</title>
    <style>
      /* Soal 1 */
      .contents {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid black;
        padding: 15px;
      }

      .form-element {
        margin: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <!-- Soal 1 -->
    <div class="contents">
      <h2 align="center">Isi data diri</h2>

      <div class="formContent">
        <form id="formDataDiri">
          <div class="form-element">
            <label for="inputNama">Nama:</label><br />
            <input
              type="text"
              id="inputNama"
              name="nama"
              placeholder="Nama Anda"
              required
            /><br />
          </div>

          <div class="form-element">
            <label for="inputEmail">Email:</label><br />
            <input
              type="text"
              id="inputEmail"
              name="email"
              placeholder="Email Anda"
              required
            /><br />
          </div>

          <div class="form-element">
            <input type="submit" value="Submit Data" />
          </div>
        </form>
      </div>
    </div>

    <!-- Soal 2 -->
    <div
    id="kotak"
    style="height: 100px; width: 170px; background-color: red; margin: auto"
  >
    KOTAKK KUUUU
  </div>

    <script>
      // Soal 1
      const ketikaSubmit = document.getElementById("formDataDiri");

      ketikaSubmit.addEventListener("submit", function (event) {
        event.preventDefault();

        const nama = document.getElementById("inputNama").value;
        const email = document.getElementById("inputEmail").value;

        alert(`Nama: ${nama} Email: ${email}`);
      });

      // Soal 2
      const kotak = document.getElementById("kotak");
      kotak.addEventListener("mouseover", function () {
        kotak.style.backgroundColor = "#4A628A";
      });
      kotak.addEventListener("mouseout", function () {
        kotak.style.backgroundColor = "#7AB2D3";
      });
    </script>
  </body>
</html>
