<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soal Gambar 1</title>
  </head>
  <body>
    <button id="triggerButton">KLIK AKU</button>
  </body>
  <script>
    const customClickEvent = new Event("cutomClickEvent");
    function handleCustomClick() {
      console.log("Costum click event triggered!");
    }

    window.addEventListener("load", function () {
      const triggerButton = document.getElementById("triggerButton");
      document.addEventListener("cutomClickEvent", handleCustomClick);
      triggerButton.addEventListener("click", function () {
        document.dispatchEvent(customClickEvent);
      });
    });
  </script>
</html>
