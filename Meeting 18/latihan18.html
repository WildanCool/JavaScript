<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 18</title>
    <style>
      .contents {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid black;
        padding: 15px;
      }
    </style>
  </head>

  <body>
    <button onclick="alert('Halo Apa Kabarrr?')">Tekan Aku!</button>

    <input type="text" id="myInput" placeholder="Ketik sesuatu..." />
    <p id="output"></p>

    <div class="contents" align="center">
      <button id="incrementButton">Tekan Aku</button>
      <h3>
        Kamu sudah menekan tombol di atas sebanyak <span id="count">0</span>
      </h3>
    </div>

    <script>
      const input = document.getElementById("myInput");
      const output = document.getElementById("output");

      input.addEventListener("input", function () {
        output.textContent = "Anda mengetik: " + input.value;
      });
      function increment() {
        document.getElementById("count").innerText++;

        if (document.getElementById("count").innerText == 7) {
          const hiddenMessage = document.createElement("h4");
          hiddenMessage.innerText =
            "Selamat! Anda menemukan hadiah tersembunyi...";
          const image = document.createElement("img");
          image.setAttribute(
            "src",
            "https://raw.githubusercontent.com/dicodingacademy/a315-web-pemula-labs/shared-files/catto.jpg"
          );
          const contents = document.querySelector(".contents");
          contents.appendChild(hiddenMessage).appendChild(image);
        }
      }

      function welcome() {
        alert("Sim salabim muncullah elemen-elemen HTML!");

        const contents = document.querySelector(".contents");
        contents.removeAttribute("hidden");
      }

      // document.getElementById("incrementButton").onclick = increment;
      // document.body.onload = welcome;

      window.addEventListener("load", welcome);
      document
        .getElementById("incrementButton")
        .addEventListener("click", increment);
    </script>
  </body>
</html>
